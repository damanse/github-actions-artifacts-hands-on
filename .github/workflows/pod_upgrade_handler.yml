name: Upgrade POD
run-name: Upgrade POD - ${{ inputs.pod }} - ${{ github.run_id }}

permissions:
  actions: write
  contents: read

on:
  workflow_call:
    inputs:
      runname:
        required: true
        type: string
      pod:
        required: true
        type: string
      hosts:
        required: true
        type: string
      start_time:
        required: true
        type: string
      end_time:
        required: true
        type: string

  workflow_dispatch:
    inputs:
      runname:
        description: 'Run name for the workflow'
        required: true
        type: string
        default: 'Upgrade POD'
      pod:
        description: 'Pod to upgrade'
        required: true
        type: string
      hosts:
        description: 'Hosts for the pod'
        required: true
        type: string
      start_time:
        description: 'Start of allowed time window (Stockholm/CET HH:MM)'
        required: true
        type: string
      end_time:
        description: 'End of allowed time window (Stockholm/CET HH:MM)'
        required: true
        type: string
        
jobs:
  debug-hosts: 
    runs-on: ubuntu-latest
    name: Debug matrix hosts
    steps:
      - name: Debug Hosts
        run: |
          echo "Hosts: ${{ inputs.hosts }}"

  upgrade-hosts:
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: true
      max-parallel: 1
      matrix:
        host: ${{ fromJson(inputs.hosts) }}
    name: Pod ${{ inputs.pod }} - Host ${{ matrix.host }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check Time Window for ${{ matrix.host }}
        run: |
          echo "Checking time window..."
  
          python3 <<EOF
          from datetime import datetime
          import sys
          from zoneinfo import ZoneInfo
          
          start_time_str = "${{ inputs.start_time }}"
          end_time_str = "${{ inputs.end_time }}"
          
          # Convert to Stockholm timezone
          cet = ZoneInfo('Europe/Stockholm')
          now = datetime.now(cet)
          
          # Get the time window for today
          start_time = datetime.strptime(start_time_str, "%H:%M").time()
          end_time = datetime.strptime(end_time_str, "%H:%M").time()
          
          # Create full datetime objects for today's window
          today = now.date()
          start_dt = datetime.combine(today, start_time).replace(tzinfo=cet)
          end_dt = datetime.combine(today, end_time).replace(tzinfo=cet)
          
          print(f"Host: ${{ matrix.host }}")
          print(f"Start time: {start_dt.strftime('%Y-%m-%d %H:%M %Z')}")
          print(f"End time: {end_dt.strftime('%Y-%m-%d %H:%M %Z')}")
          print(f"Current time: {now.strftime('%Y-%m-%d %H:%M %Z')}")
          
          # Time window comparison
          if not (start_time <= now.time() <= end_time):
              print(f"Current time {now.strftime('%Y-%m-%d %H:%M %Z')} is outside allowed window")
              print("Ending upgrades for this host.")
              sys.exit(1)
          
          print(f"Current time {now.strftime('%Y-%m-%d %H:%M %Z')} is within allowed window, proceeding with upgrade.")
          EOF
     
      - name: Check Big Red Button on ${{ matrix.host }}
        id: check-big-red-button
        run: |
          echo "Checking Big Red Button for ${{ matrix.host }}..."
          
          python3 <<EOF
          import subprocess
          import sys
          
          host = "${{ matrix.host }}"
          
          try:
              result = subprocess.run([
                  "ansible-playbook",
                  "playbooks/check-big-red-button.yml",
                  "--extra-vars", f"target_host={host}"
              ], check=True)
              print("Big Red Button check passed.")
          except subprocess.CalledProcessError as e:
              print(f"Big Red Button check has been executed, stopping this run! Details: {e.returncode}")
              sys.exit(1)
          EOF

      - name: Run Upgrade on ${{ matrix.host }}
        id: upgrade
        env:
          PY_COLORS: '1'
          ANSIBLE_FORCE_COLOR: '1'
        run: |
          echo "Running upgrade script on ${{ matrix.host }}"
          echo "Checking time window (${{ inputs.start_time }} - ${{ inputs.end_time }})"
          echo "Checking Big Red Button..."
          echo "Starting upgrade..."

          python3 <<EOF
          import subprocess
          import time
          import sys
          import random
          
          host = "${{ matrix.host }}"
          max_attempts = 3
          sleep_seconds = 5
          
          for attempt in range(1, max_attempts + 1):
              print(f"Attempt {attempt} of {max_attempts} for host: {host}")
          
              try:
                  result = subprocess.run([
                      "ansible-playbook",
                      "playbooks/upgrade-playbook.yml",
                      "--extra-vars", f"target_host={host}"
                  ], check=True)
                  
                  print(f"Upgrade succeeded on attempt {attempt}")
                  sys.exit(0)
          
              except subprocess.CalledProcessError as e:
                  print(f"Playbook failed on attempt {attempt} with code {e.returncode}")
                  if attempt < max_attempts:
                      print(f"⏳ Retrying in {sleep_seconds} seconds...")
                      time.sleep(sleep_seconds)
                  else:
                      print("Upgrade failed after all retries.")
                      sys.exit(1)
          EOF